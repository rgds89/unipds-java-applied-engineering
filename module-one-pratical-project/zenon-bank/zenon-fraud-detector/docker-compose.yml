services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zenon
      MYSQL_USER: zenon
      MYSQL_PASSWORD: zenon
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uzenon", "-pzenon"]
      interval: 5s
      timeout: 5s
      retries: 20
